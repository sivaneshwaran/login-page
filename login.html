<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

<!-- Css files -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="login">
    <!-- heading -->
        <h1>
            Login
        </h1>
    <!-- Login  -->
        <form action="" class="login-form">

        <!-- User name input -->
            <div class="input-box">
                <label for="username-input">User name</label>
                <input type="text" id="username-input" placeholder="Please Enter your User Name" required>
            </div>

        <!-- Password input -->
            <div class="input-box">
                <label for="password-input">Password</label>
                <input type="password" id="password-input" placeholder="Please Enter your Password" required>
            </div>

        <!-- Submit button -->
            <div class="submit">
                <input type="submit" value="submit">
            </div>
            <p>Have no accout <a href="signup.html" style="text-decoration: none;">Sign-up</a></p>
        </form>
    </section>
</body>
</html>
