<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up</title>

<!-- CSS files -->
    <link rel="stylesheet" href="style-signup.css">
</head>
<body>  
    <section class="signup">
        <h1>Sign Up</h1>
        <form action="" class="signup-form">
        <!-- Name input -->
            <div class="input-box">
                <label for="name-input">Name</label>
                <input type="text" id="name-input" placeholder="Please Enter your Name" required>
            </div>

        <!-- Phone Number input -->
            <div class="input-box">
                <label for="phone-input">Phone Number</label>
                <input type="text" id="phone-input" placeholder="Please Enter your Phone Number" required>
            </div>

        <!-- Mail Id input -->
            <div class="input-box">
                <label for="mail-input">Mail ID</label>
                <input type="email" id="mail-input" placeholder="Please Enter your Mail ID" required>
            </div>

        <!-- User name input -->
            <div class="input-box">
                <label for="name-input">User name</label>
                <input type="text" id="username-input" placeholder="Please Enter your Username" required>
            </div>


        <!-- Password -->
            <div class="input-box">
                <label for="password-input">Password</label>
                <input type="password" id="password-input" placeholder="Please Enter your password" required>
            </div>

        <!-- Confirm Password -->
            <div class="input-box">
                <label for="cpassword-input">Confirm Password</label>
                <input type="password" id="cpassword-input" placeholder="Please Enter your Confirm password" required>
            </div>
            
            <div class="submit">
                <input type="submit" value="submit">
            </div>

            <p>Have no accout <a href="login.html" style="text-decoration: none;">Login</a></p>
        </form>
    </section>
</body>
</html>
